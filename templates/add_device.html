<html>
<head>
    <title>Add Device</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='theme.js') }}"></script>
</head>
<body class="dashboard-page">

    <div class="dashboard"> 

        <div class="side-bar">
            <h2>IT System</h2>

            <a href="{{ url_for('user_dashboard') }}">Back to Dashboard</a>

            <button onclick="toggleDarkMode()" class="dark-mode-btn">
                Dark Mode
            </button>

            <a href="{{ url_for('logout') }}">Logout</a>
        </div>

        <div class="main-content">

            <h1>Add New Device</h1>

            {% if error %}
            <p style="color: red;">{{ error }}</p>
            {% endif %}

            <p>Manage the devices in your organisation.</p>

            <div class="form-styling">

                <form method="POST" action="/add_device">

                    <label>Device Name:</label>
                    <input type="text" name="device_name" required>
                    <br><br>

                    <label>Device Type:</label>
                    <input type="text" name="device_type" required>
                    <br><br>

                    <label>Assigned To:</label>
                    <select name="assigned_to" required>
                        {% for user in users %}
                        <option value="{{ user.id }}">{{ user.name }}</option>
                        {% endfor %}
                    </select>
                    <br><br>

                    <label>Serial Number:</label>
                    <input type="text" name="serial_number" required>
                    <br><br>

                    <label>Location:</label>
                    <input type="text" name="location" required>
                    <br><br>

                    <label>Last Maintenance Date:</label>
                    <input type="date" name="last_maintenance_date" required>
                    <br><br>

                    <button type="submit">Add Device</button>

                </form>

            </div>

        </div>

    </div>

</body>
</html>
